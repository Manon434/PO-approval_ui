<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0070b1" />
    <title>POP Approval Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fbfd 0%, #eef3f7 100%);
        color: #102a43;
        font-family: Aptos, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 460px);
        border: 1px solid #dbe5ee;
        border-radius: 28px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: #0070b1;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #52677a;
        line-height: 1.7;
      }

      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 18px;
        background: #0070b1;
        color: #ffffff;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">POP</div>
      <h1>You are offline</h1>
      <p>
        POP Approval is installed and ready, but purchase orders require a secure network connection before
        approval data can be loaded or submitted.
      </p>
      <button type="button" onclick="window.location.reload()">Retry connection</button>
    </main>
  </body>
</html>
